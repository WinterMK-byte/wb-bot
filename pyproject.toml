[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-bot"
version = "0.3.3"
description = "多 Agent 协作的纪律层：append-only 总线 / 席位边界 / 跨运行时交接契约 / 一份从真实事故长出来的反错清单"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "WinterMK-byte" }]
keywords = ["multi-agent", "coordination", "append-only", "handoff", "agent-bus", "mcp", "discipline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# 核心零依赖；只有要用 MCP server 才需要 mcp
[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
wbb = "wbb.cli:main"

[project.urls]
Homepage = "https://github.com/WinterMK-byte/wb-bot"
Documentation = "https://github.com/WinterMK-byte/wb-bot/blob/main/docs/README.md"
Changelog = "https://github.com/WinterMK-byte/wb-bot/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["wbb"]
