name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 自测（py${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查
        run: |
          python -m py_compile wbb/bus.py wbb/lease.py wbb/migrate.py wbb/cli.py mcp_server.py
          python -m py_compile tools/privacy_check.py tools/usability_check.py tools/check_mcp.py
          python -m py_compile tools/version_check.py tools/link_check.py tools/changelog_extract.py

      - name: 总线核心自测（20 项：并发 / 重号 / 行序 / 表格连续性 / 归档 / 锁）
        run: python -m wbb.bus

      - name: 资源租约自测（15 项：双轨判定 + 降级轨 / 退出码 / 僵尸抢占 / 不足即停）
        run: python -m wbb.lease

      - name: 运行时迁移自测（23 项：接续五节 / 未闭口筛选 / 审计退出码 / 跳过二进制与大文件 / CJK 路径）
        run: python -m wbb.migrate

      - name: CLI 冒烟（append → verify → read → claim → view）
        run: |
          export WBB_BUS="$(mktemp -d)/00-bus.md"
          printf '# 协作总线\n\n## 总线\n\n| ID | time | source | role | what | status | artifact | need |\n|---|---|---|---|---|---|---|---|\n\n---\n\n## 变更记录\n\n| 日期 | 变更 |\n|---|---|\n' > "$WBB_BUS"
          python -m wbb.cli --bus "$WBB_BUS" append "ci|architect|冒烟测试|done|-|-"
          python -m wbb.cli --bus "$WBB_BUS" verify
          python -m wbb.cli --bus "$WBB_BUS" read --since 0
          python -m wbb.cli --bus "$WBB_BUS" claim "x.md|ci"
          python -m wbb.cli --bus "$WBB_BUS" release "x.md"
          python -m wbb.cli --bus "$WBB_BUS" view ci

      - name: CLI 冒烟 · 迁移（render → audit）
        run: |
          D="$(mktemp -d)"
          printf '# identity\n\n我是执行方。\n' > "$D/id.md"
          python -m wbb.cli migrate render --bus "$WBB_BUS" --identity "$D/id.md" --out "$D/handoff.md"
          test -s "$D/handoff.md"
          python -m wbb.cli migrate audit --root "$D" --old "old-root" && echo "audit 零命中（预期）"

      - name: 开箱可用性（模拟「新人拿到仓库」的完整路径）
        run: python tools/usability_check.py

  windows:
    name: Windows · CJK 路径（卖点验证）
    runs-on: windows-latest
    env:
      # ★ Windows 控制台默认**不是** UTF-8 —— 不加这两个，
      #   任何往 stdout 写中文的地方都会 UnicodeEncodeError。
      #   （Linux job 不受影响，但本机实测时也必须带 -X utf8）
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ★ 本项目主打「**CJK 路径安全**」—— 但 CI 只跑 Linux 的话，这句话等于没验证。
      #   这个 job 就是把这个卖点在**真实 Windows** 上跑一遍。
      # 诊断：本机（UTF-8）永远发现不了的问题，先看清这个环境到底是什么编码
      - name: 环境诊断（编码 / shell / 文件系统编码）
        shell: bash
        run: |
          echo "shell: $0"
          python -c "import sys,locale;print('stdout.encoding =',sys.stdout.encoding);print('filesystemencoding =',sys.getfilesystemencoding());print('preferred =',locale.getpreferredencoding())"

      # ⚠️ Windows runner 的默认 shell 是 **pwsh** —— 中文输出在那里会出问题
      #    （本机 UTF-8 环境永远发现不了）。所以本 job **全部显式用 bash**。
      - name: 自测（Windows）
        shell: bash
        run: |
          python -m wbb.bus
          python -m wbb.lease
          python -m wbb.migrate

      - name: ★ 在**中文路径**下跑完整流程
        shell: bash
        run: |
          mkdir -p "测试目录/中文 路径/子目录"
          cp templates/00-bus.md "测试目录/中文 路径/子目录/00-bus.md"
          B="测试目录/中文 路径/子目录/00-bus.md"
          python -X utf8 -m wbb.cli --bus "$B" append "alice|architect|在中文路径下写一条|done|-|bob"
          python -X utf8 -m wbb.cli --bus "$B" verify
          python -X utf8 -m wbb.cli --bus "$B" read --since 0
          python -X utf8 -m wbb.cli --bus "$B" claim "共享.md|ci"
          python -X utf8 -m wbb.cli --bus "$B" release "共享.md"
          python -X utf8 -m wbb.cli --bus "$B" status

      - name: ★ 在**中文路径**下迁移（render + audit）
        shell: bash
        run: |
          D="测试目录/中文 路径/子目录"
          printf '# identity\n\n我是执行方。\n' > "$D/身份.md"
          python -X utf8 -m wbb.cli migrate render --bus "$D/00-bus.md" \
                 --identity "$D/身份.md" --out "$D/接续 文本.md"
          test -s "$D/接续 文本.md"
          python -X utf8 -m wbb.cli migrate audit --root "$D" --old "不存在的旧位置"

      - name: 开箱可用性（Windows）
        shell: bash
        run: python tools/usability_check.py

      # ★ 顺手把新的门禁也在 GBK 控制台下跑一遍 ——
      #   它们是"给人看的输出"，中文乱码就等于没输出（v0.3.3 就是这么被 CI 抓出来的）
      - name: ★ 仓库门禁（Windows · GBK 控制台）
        shell: bash
        run: |
          python tools/version_check.py
          python tools/link_check.py

  gates:
    name: 仓库一致性（版本 / 文档 / 变更日志）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 这三道门禁的意义：把"老成员记得、新人不知道"的纪律变成机械可查的东西。
      # 每个人（也包括我们自己）跳过一步，都会在这里现形。
      - name: 门禁工具自测（先证明它们抓得到错）
        run: |
          python tools/version_check.py --selftest
          python tools/link_check.py --selftest
          python tools/changelog_extract.py --selftest

      - name: 版本三处一致
        run: python tools/version_check.py

      - name: 相对链接可达 + docs 索引完整
        run: python tools/link_check.py

      # 发版用的抽段器 —— 日常也验一次，避免它到发版那天才发现坏了
      - name: CHANGELOG 可抽段（发版流程依赖它）
        run: |
          for v in $(python tools/changelog_extract.py --list); do
            python tools/changelog_extract.py "$v" > /dev/null
            echo "  ✅ 可抽出 [$v]"
          done

  privacy:
    name: 隐私门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 仓库公开后，任何人 push 的 PR 都会先过这道闸：
      # 命中关键词 / PII 形状 / 零宽字符 / 可疑文件 / 越界引用 → 直接 fail。
      # 私有词表放 privacy_words.txt（已 .gitignore），CI 上不存在也不会报错。
      - name: 脱敏自查
        run: python tools/privacy_check.py

  mcp:
    name: MCP server 可导入 + 注册 7 个工具
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⚠️ 别把 Python 直接写成 run 里的 heredoc：
      #    YAML 块的内容带缩进，而 bash 的结束标记必须**顶格** —— 必然失配。
      #    做成独立文件既避开这个坑，也让本地能跑同一条检查。
      - name: 装 mcp 并验证工具齐备
        run: |
          python -m pip install --quiet mcp
          python tools/check_mcp.py
