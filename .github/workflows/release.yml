# 打 tag 即发版：v0.5.0 → GitHub Release，notes 从 CHANGELOG 对应条目抽取。
#
# 两个刻意的设计：
#   ① **不用第三方 action**（社区常见的 release action）—— 只用 runner 自带的 `gh`。
#      发版链条上少一个第三方依赖，少一处可能悄悄变味的地方。
#   ② **notes 派生自 CHANGELOG，不手写**。手写就会出现两份，而两份必然不同步；
#      发版页正是用户第一眼看到的那段文字，最不该漂。
#
# 抽不到对应版本会**直接失败**（`tools/changelog_extract.py` 退出码 1）——
# 宁可发不出去，也不要发一份空 notes。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发版的 tag（形如 v0.5.0）"
        required: true

permissions:
  contents: write      # 建 Release 需要写权限

jobs:
  release:
    name: 发版（先自测，再建 Release）
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 发版前自测（发出去的版本至少自己测过）
        run: |
          python -m wbb.bus
          python -m wbb.lease
          python -m wbb.migrate
          python tools/usability_check.py

      # ★ tag 说的版本 必须等于 仓库里的版本（三处一致）
      #   不查这一条，就会发出「v0.5.0 的 release，内容是 0.4.0」这种事实错误 ——
      #   而它是**不可撤销的公开记录**。
      - name: 版本与 tag 对齐
        run: |
          echo "tag = $TAG"
          python tools/version_check.py --expect "${TAG#v}"

      - name: 文档一致性
        run: python tools/link_check.py

      - name: 从 CHANGELOG 抽本次版本的 notes
        run: |
          python tools/changelog_extract.py "${TAG#v}" --out notes.md
          echo "--- notes 预览（前 20 行）---"
          head -n 20 notes.md

      - name: 建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 —— 更新 notes（重跑安全）"
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
